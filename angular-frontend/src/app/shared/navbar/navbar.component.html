<nav class="px-4 py-4 md:px-8 bg-[#C0A3A7]">
  <div class="flex items-center justify-between">
    <!-- Logo + Eslogan -->
    <div class="flex items-center gap-4">
      <img routerLink="/" src="logo.png" alt="Logo" class="w-12 h-12 md:w-14 md:h-14 cursor-pointer" />
      <span routerLink="/" class="text-lg md:text-xl font-semibold font-serif cursor-pointer">Florece con cada
        movimiento</span>
    </div>

    <!-- Botón Hamburguesa (solo visible en móvil) -->
    <button (click)="toggleMobileMenu()" class="block md:hidden text-2xl focus:outline-none">
      ☰
    </button>

    <!-- Enlaces de navegación (ocultos en móvil) -->
    <ul class="hidden md:flex gap-8 text-base font-light ml-0 md:ml-40 lg:ml-80">
      <li><a routerLink="/sobre-nosotros" class="hover:underline">Sobre Nosotros</a></li>
      <li><a routerLink="/clases" class="hover:underline">Clases</a></li>
      <li>
        <a [routerLink]="authService.isAdmin() ? '/admin/horarios' : '/horarios'" class="hover:underline">
          Horarios
        </a>
      </li>
      <li>
        <a [routerLink]="authService.isAdmin() ? '/admin/tarifas' : '/tarifas'" class="hover:underline">
          Tarifas
        </a>
      </li>
      <li><a routerLink="/contactanos" class="hover:underline">Contáctanos</a></li>
    </ul>

    <!-- Botón de usuario / login -->
    <ng-container *ngIf="authService.isLoggedIn()">
      <div class="relative hidden md:block">
        <button (click)="toggleMenu()"
          class="flex items-center gap-2 border border-[#EACFCE] rounded-full px-4 py-2 hover:bg-black hover:text-white transition">
          <span>{{ userName }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
            <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
          </svg>
        </button>
        <div *ngIf="isMenuOpen" class="absolute right-0 mt-2 w-40 bg-white text-black shadow-lg rounded z-50">
          <a routerLink="/reservar-clase" class="block px-4 py-2 hover:bg-gray-100">Reservar Clase</a>
          <!-- Solo para admin -->
          <a *ngIf="authService.isAdmin()" routerLink="/admin/pases" class="block px-4 py-2 hover:bg-gray-100">Pases</a>
          <button (click)="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-100 text-[#917b7e]">Cerrar sesión</button>
        </div>
      </div>
    </ng-container>

    <!-- Botón de Iniciar Sesión comentado -->
    <!--
    <ng-template #loginButton>
      <button routerLink="/login"
        class="hidden md:block border border-[#EACFCE] rounded-full px-6 py-2 text-sm hover:bg-black hover:text-white transition">
        Iniciar Sesión
      </button>
    </ng-template>
    -->

  </div>

  <!-- Menú desplegable en móvil -->
  <div [class.hidden]="!isMobileMenuOpen" class="mt-4 md:hidden flex-col space-y-4">
    <a routerLink="/clases" (click)="closeMobileMenu()" class="block hover:underline">Clases</a>
    <a routerLink="/sobre-nosotros" (click)="closeMobileMenu()" class="block hover:underline">Sobre Nosotros</a>
    <a routerLink="/horarios" (click)="closeMobileMenu()" class="block hover:underline">Horarios</a>
    <a routerLink="/tarifas" (click)="closeMobileMenu()" class="block hover:underline">Tarifas</a>
    <a routerLink="/contactanos" (click)="closeMobileMenu()" class="block hover:underline">Contáctanos</a>

    <!-- Botón de Iniciar Sesión móvil comentado -->
    <!--
    <button routerLink="/login" (click)="closeMobileMenu()"
      class="w-full border border-black rounded-full px-6 py-2 text-sm hover:bg-black hover:text-white transition">
      Iniciar Sesión
    </button>
    -->
  </div>
</nav>
