<div class="min-h-screen flex flex-col bg-white">
  <!-- Título -->
  <div class="bg-[#FCF7F8] h-32 flex items-center justify-center">
    <h1 class="text-3xl font-semibold text-center">Contáctanos</h1>
  </div>

  <!-- Formulario -->
  <div class="bg-[#EACFCE] py-16 px-4 md:px-32">
    <form class="max-w-3xl mx-auto space-y-6" (ngSubmit)="onSubmit()" [formGroup]="contactForm">
      <!-- Nombre -->
      <div>
        <label class="block text-lg font-medium mb-1">Nombre:</label>
        <input type="text" formControlName="nombre"
          class="w-full px-4 py-2 bg-[#FCF7F8] border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-lg font-medium mb-1">Email:</label>
        <input type="email" formControlName="email"
          class="w-full px-4 py-2 bg-[#FCF7F8] border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
      </div>

      <!-- Mensaje -->
      <div>
        <label class="block text-lg font-medium mb-1">Mensaje:</label>
        <textarea rows="6" formControlName="mensaje"
          class="w-full px-4 py-2 bg-[#FCF7F8] border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]"></textarea>
      </div>

      <!-- Botón enviar -->
      <div class="text-right">
        <button type="submit"
          class="bg-white border border-black px-6 py-2 text-black font-medium rounded hover:bg-black hover:text-white transition">
          ENVIAR
        </button>
      </div>
    </form>
  </div>

  <!-- Mapa + contacto -->
  <div class="bg-white py-10 px-4 md:px-20">
    <div class="flex flex-col md:flex-row md:justify-between items-center gap-8">
      <!-- Mapa -->
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3110.030393759706!2d2.6437928!3d39.5723058!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x129792528db19c01%3A0x5a537933e91b0e0c!2sAcademia%20Flor%20%26%20Barre!5e0!3m2!1ses!2ses!4v0000000000000"
        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        class="rounded shadow-md w-full md:w-2/3">
      </iframe>

      <!-- Datos de contacto -->
      <div class="text-center md:text-left mt-6 md:mt-0 md:w-1/3 space-y-2 text-gray-700 text-lg">
        <p><strong>Av. Jaime III 5A, Entresuelo,</strong><br>Palma de Mallorca.</p>
        <p><strong>florybarre&#64;academia.com</strong></p>
        <p><strong>679795209</strong></p>
      </div>
    </div>
  </div>
</div>
