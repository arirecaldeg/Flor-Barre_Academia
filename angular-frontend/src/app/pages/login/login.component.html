<div class="min-h-screen flex flex-col justify-between bg-white">
    <!-- Título sobre fondo blanco -->
    <div>
        <h1 class="mx-auto text-3xl font-semibold text-center mt-10">Inicia Sesión</h1>

        <!-- Fondo rosa solo en esta sección -->
        <div class="bg-[#E5D2D2] py-32 mt-20 mb-10">
            <div class="max-w-sm mx-auto bg-white p-6 rounded-md shadow">
                <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" formControlName="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />

                    <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Contraseña</label>
                    <input type="password" formControlName="password"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />

                    <button type="submit"
                        class="w-full mt-6 bg-[#e1c7c7] text-white font-medium py-2 rounded hover:bg-[#d4b6b6]">
                        Accede
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="" class="text-sm text-gray-600 underline hover:text-black">
                        ¿Has olvidado la contraseña?
                    </a>
                </div>

                <button class="w-full mt-4 bg-[#e1c7c7] text-white font-medium py-2 rounded hover:bg-[#d4b6b6]"
                    (click)="goToRegister()">
                    Regístrate
                </button>
            </div>
        </div>
    </div>

    <!-- Logo abajo sobre fondo blanco -->
    <div class="mx-auto my-10 pr-10">
        <img src="florybarrefirma.png" alt="Flor y Barre logo" class="w-80 inline-block" />
    </div>
</div>
