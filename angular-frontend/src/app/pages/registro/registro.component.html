<div class="min-h-screen flex flex-col bg-white">
  <!-- Título blanco -->
  <div class="bg-[#FCF7F8] h-32 flex items-center justify-center">
    <h1 class="text-3xl font-semibold text-center">Regístrate</h1>
  </div>

  <!-- Bloque rosa -->
  <div class="flex-grow bg-[#EACFCE] py-20">
    <!-- Formulario -->
    <div class="max-w-sm mx-auto bg-[#FCF7F8] p-6 rounded-md shadow">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- Nombre -->
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre y Apellidos</label>
        <input type="text" formControlName="nombre"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
        <div *ngIf="registerForm.get('nombre')?.touched && registerForm.get('nombre')?.invalid" class="text-red-500 text-xs mt-1">
          El nombre es obligatorio
        </div>

        <!-- Email -->
        <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Email</label>
        <input type="email" formControlName="email"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="text-red-500 text-xs mt-1">
          <div *ngIf="registerForm.get('email')?.errors?.['required']">El email es obligatorio</div>
          <div *ngIf="registerForm.get('email')?.errors?.['email']">El formato no es válido</div>
        </div>

        <!-- Contraseña -->
        <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Contraseña</label>
        <input type="password" formControlName="password"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="text-red-500 text-xs mt-1">
          <div *ngIf="registerForm.get('password')?.errors?.['required']">La contraseña es obligatoria</div>
          <div *ngIf="registerForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</div>
        </div>

        <!-- Confirmar contraseña -->
        <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Confirma Contraseña</label>
        <input type="password" formControlName="confirmPassword"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#E5D2D2]" />
        <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid" class="text-red-500 text-xs mt-1">
          Este campo es obligatorio
        </div>

        <!-- Error si no coinciden -->
        <div *ngIf="registerForm.errors?.['passwordsMismatch'] && registerForm.touched" class="text-red-500 text-xs mt-1">
          Las contraseñas no coinciden
        </div>

        <!-- Política legal -->
        <div class="flex items-center mt-4">
          <input id="politica" type="checkbox" formControlName="politica" class="mr-2" />
          <label for="politica" class="text-sm text-gray-700">Acepto la <a href="#" class="underline">política legal</a></label>
        </div>
        <div *ngIf="registerForm.get('politica')?.touched && registerForm.get('politica')?.invalid" class="text-red-500 text-xs mt-1">
          Debes aceptar la política legal
        </div>

        <!-- Botón de registro -->
        <button type="submit"
          class="w-full mt-6 bg-[#C0A3A7] text-white font-medium py-2 rounded hover:bg-[#d4b6b6]">
          Regístrate
        </button>

        <!-- Botón de volver -->
        <button type="button"
          class="w-full mt-2 bg-[#C0A3A7] text-white font-medium py-2 rounded hover:bg-[#d4b6b6]"
          (click)="goToLogin()">
          Atrás
        </button>
      </form>
    </div>

    <!-- Logo -->
    <div class="flex justify-center mt-10">
      <img src="florybarrefirma.png" alt="Flor y Barre logo" class="w-80" />
    </div>
  </div>
</div>
